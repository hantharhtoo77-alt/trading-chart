<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phoe Ree Futures Dashboard Pro V20</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body {
    background: #0b0e11;
    color: white;
    font-family: sans-serif;
}

.stats-card {
    background: #1e2329;
    border-radius: 14px;
    border: 1px solid #2b3139;
}

.tab-btn {
    padding: 8px 14px;
    border-radius: 10px;
    background: #2b3139;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

.tab-active {
    background: #f0b90b;
    color: black;
}

.price-font {
    font-family: monospace;
}
</style>
</head>

<body class="p-3">

<div class="max-w-7xl mx-auto space-y-4">

<div class="stats-card p-4 flex flex-col lg:flex-row justify-between items-center gap-4">

<div>
<h1 class="text-2xl font-black text-yellow-400">
Phoe Ree Futures Dashboard Pro V20
</h1>
<p class="text-xs text-gray-400">
Realtime AI Futures Dashboard
</p>
</div>

<div class="flex gap-2 flex-wrap">
<div class="tab-btn tab-active" onclick="changeCoin('BTCUSDT')">BTC</div>
<div class="tab-btn" onclick="changeCoin('ETHUSDT')">ETH</div>
<div class="tab-btn" onclick="changeCoin('SOLUSDT')">SOL</div>
<div class="tab-btn" onclick="changeCoin('BNBUSDT')">BNB</div>
</div>

</div>

<div class="grid grid-cols-1 md:grid-cols-5 gap-3">

<div class="stats-card p-4 text-center">
<div class="text-xs text-gray-400">LIVE PRICE</div>
<div id="live-price" class="text-3xl font-black price-font mt-2">
--
</div>
</div>

<div class="stats-card p-4 text-center">
<div class="text-xs text-gray-400">TREND</div>
<div id="trend" class="text-2xl font-black mt-2 text-yellow-400">
ANALYZING
</div>
</div>

<div class="stats-card p-4 text-center">
<div class="text-xs text-gray-400">ENTRY</div>
<div id="entry" class="text-2xl font-black mt-2 text-green-400">
--
</div>
</div>

<div class="stats-card p-4 text-center">
<div class="text-xs text-gray-400">STOP LOSS</div>
<div id="sl" class="text-2xl font-black mt-2 text-red-400">
--
</div>
</div>

<div class="stats-card p-4 text-center">
<div class="text-xs text-gray-400">TAKE PROFIT</div>
<div id="tp" class="text-2xl font-black mt-2 text-blue-400">
--
</div>
</div>

</div>

<div class="grid grid-cols-1 lg:grid-cols-4 gap-4">

<div class="lg:col-span-3 stats-card overflow-hidden h-[550px]">
<div id="tv_chart_container" class="w-full h-full"></div>
</div>

<div class="stats-card p-4 space-y-4">

<div>
<div class="text-xs text-gray-400 mb-2">
SIGNAL CONFIDENCE
</div>
<div id="confidence"
class="text-4xl font-black text-purple-400">
0%
</div>
</div>

<div>
<div class="text-xs text-gray-400 mb-2">
AI MARKET INSIGHT
</div>
<div id="ai-insight"
class="text-sm text-gray-300 leading-relaxed">
Loading...
</div>
</div>

<div>
<div class="text-xs text-gray-400 mb-2">
LATEST NEWS
</div>
<div id="news"
class="space-y-2 text-sm text-gray-300">
Loading...
</div>
</div>

</div>

</div>

</div>

<script>

let currentSymbol = 'BTCUSDT';
let socket;

function initChart(symbol) {

new TradingView.widget({
    symbol: `BINANCE:${symbol}`,
    interval: '15',
    timezone: 'Asia/Yangon',
    theme: 'dark',
    style: '1',
    container_id: 'tv_chart_container',
    width: '100%',
    height: '100%'
});

}

function changeCoin(symbol) {

currentSymbol = symbol;

connectSocket(symbol);

initChart(symbol);

}

function connectSocket(symbol) {

if(socket) {
    socket.close();
}

socket = new WebSocket(
`wss://fstream.binance.com/ws/${symbol.toLowerCase()}@ticker`
);

socket.onmessage = (event) => {

const data = JSON.parse(event.data);

const price = parseFloat(data.c);
const change = parseFloat(data.P);

updateUI(price, change);

};

socket.onclose = () => {
setTimeout(() => {
connectSocket(symbol);
}, 3000);
};

}

function updateUI(price, change) {

const priceEl = document.getElementById('live-price');
priceEl.textContent = `$${price.toLocaleString()}`;

let trend = 'SIDEWAYS';
let confidence = 50;

if(change > 1) {
trend = 'LONG';
confidence = 84;
}

if(change < -1) {
trend = 'SHORT';
confidence = 82;
}

const trendEl = document.getElementById('trend');
trendEl.textContent = trend;

if(trend === 'LONG') {
trendEl.className = 'text-2xl font-black mt-2 text-green-400';
}

else if(trend === 'SHORT') {
trendEl.className = 'text-2xl font-black mt-2 text-red-400';
}

const entry = trend === 'LONG'
? price * 0.995
: price * 1.005;

const sl = trend === 'LONG'
? entry * 0.99
: entry * 1.01;

const tp = trend === 'LONG'
? entry * 1.025
: entry * 0.975;


document.getElementById('entry').textContent =
`$${entry.toFixed(2)}`;


document.getElementById('sl').textContent =
`$${sl.toFixed(2)}`;


document.getElementById('tp').textContent =
`$${tp.toFixed(2)}`;


document.getElementById('confidence').textContent =
`${confidence}%`;

}

async function loadNews() {

const newsEl = document.getElementById('news');

const news = [
'Bitcoin ETF inflows increasing strongly',
'FED policy impacting crypto volatility',
'Whale accumulation detected on Binance',
'Open interest rising in futures market'
];

newsEl.innerHTML = news.map(n =>
`<div class="bg-black/20 p-2 rounded-lg">• ${n}</div>`
).join('');

}

async function loadAIInsight() {

const insight = `
Market volatility remains elevated.
Use lower leverage and wait for confirmation before entering.
BTC futures momentum currently active.
`;

const el = document.getElementById('ai-insight');

el.textContent = insight;

}

window.onload = async () => {

initChart(currentSymbol);

connectSocket(currentSymbol);

loadNews();

loadAIInsight();

};

</script>

</body>
</html>
